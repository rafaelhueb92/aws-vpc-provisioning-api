name: deploy

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
      - "permission-policy.json"
      - deploy.yml
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
      - "permission-policy.json"
  workflow_dispatch:
    inputs:
      destroy:
        description: Destroy the stack instead of applying it
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.14.5
  PYTHON_VERSION: "3.12"
  TF_VAR_github_repository: ${{ github.repository }}
  TF_VAR_github_branch: ${{ github.event.repository.default_branch }}
  LAMBDA_BUILD_DIR: infra/build

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and unit tests
    runs-on: ubuntu-latest
    if: ${{ !inputs.destroy  }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/test/requirements.txt

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r test/requirements.txt

      - name: Run Ruff
        run: ruff check . --select E9,F63,F7,F82

      - name: Unit tests
        working-directory: app
        run: python -m pytest -v

  terraform:
    name: ${{ inputs.destroy && 'destroy' || 'apply'}}
    runs-on: ubuntu-latest
    needs: test
    if: ${{ !failure() && !cancelled() }}

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        if: ${{ !inputs.destroy }}
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build Lambda deployment package
        working-directory: ${{ github.workspace }}
        if: ${{ !inputs.destroy }}
        run: |
          bash scripts/build_lambda.sh \
            --app-dir app \
            --out-dir "${LAMBDA_BUILD_DIR}" \
            --python-version "${PYTHON_VERSION}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY || 'vpc-provisioning-api/terraform.tfstate' }}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        if: ${{ !inputs.destroy }}
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply
        if: ${{ !inputs.destroy }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform destroy
        if: ${{ inputs.destroy }}
        run: terraform destroy -input=false -no-color -auto-approve

      - name: Terraform Ouptut
        if: ${{ !inputs.destroy }}
        run: terraform output
