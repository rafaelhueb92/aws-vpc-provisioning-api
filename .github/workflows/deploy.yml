name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  TF_VERSION: 1.14.5
  PYTHON_VERSION: "3.12"
  TF_VAR_github_repository: ${{ github.repository }}
  TF_VAR_github_branch: ${{ github.event.repository.default_branch }}
  LAMBDA_BUILD_DIR: infra/build

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: lint and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/test/requirements.txt

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r test/requirements.txt

      - name: Lint with ruff
        run: ruff check --output-format=github .

      - name: Unit tests
        working-directory: app
        run: python -m pytest -v

  terraform:
    name: ${{ github.event_name == 'pull_request' && 'plan' || 'apply' }}
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build Lambda deployment package
        working-directory: .
        run: |
          set -euo pipefail
          rm -rf "${LAMBDA_BUILD_DIR}"
          mkdir -p "${LAMBDA_BUILD_DIR}"

          python -m pip install --quiet --target "${LAMBDA_BUILD_DIR}" \
            --platform manylinux2014_x86_64 --implementation cp \
            --python-version "${PYTHON_VERSION}" --only-binary=:all: \
            -r app/requirements.txt

          rsync -a \
            --exclude 'venv' --exclude 'test' --exclude '.abacusai' \
            --exclude '__pycache__' --exclude '*.pyc' \
            app/ "${LAMBDA_BUILD_DIR}/"

          cd "${LAMBDA_BUILD_DIR}"
          rm -f lambda.zip
          zip -q -r lambda.zip . -x '*__pycache__*' '*.pyc'
          ls -lh lambda.zip
          unzip -l lambda.zip | grep -E "handler.py|_pydantic_core" || true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY || 'vpc-provisioning-api/terraform.tfstate' }}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan
