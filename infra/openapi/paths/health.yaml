# One file per path: the top level key is the OpenAPI path itself, then its
# operations. Assembled into the imported document by infra/local.tf.
"/health":
  get:
    operationId: health
    summary: Liveness probe
    description: Public endpoint, no token required.
    tags: [Health]
    responses:
      "200":
        description: The service is up.
        content:
          application/json:
            schema:
              type: object
              properties:
                health:
                  type: boolean
    x-amazon-apigateway-integration:
      type: aws_proxy
      httpMethod: POST
      payloadFormatVersion: "1.0"
      uri: ${lambda_invoke_uri}
