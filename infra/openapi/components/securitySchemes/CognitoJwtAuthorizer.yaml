# One file per scheme: the top level key is the securitySchemes entry name,
# which is what operations reference under `security`.
CognitoJwtAuthorizer:
  type: oauth2
  flows:
    implicit:
      authorizationUrl: ${cognito_issuer}
      scopes: {}
  x-amazon-apigateway-authorizer:
    type: jwt
    identitySource: $request.header.Authorization
    jwtConfiguration:
      issuer: ${cognito_issuer}
      audience:
        - ${cognito_client_id}
